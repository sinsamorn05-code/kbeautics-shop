<script>/* no zoom: block pinch-zoom and double-tap zoom (works on iPhone and Android) */
(function(){
  const stop = e => e.preventDefault();
  document.addEventListener('gesturestart', stop, { passive:false });
  document.addEventListener('gesturechange', stop, { passive:false });
  document.addEventListener('gestureend', stop, { passive:false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive:false });
  let last = 0; document.addEventListener('touchend', e => { const n = Date.now(); if (n - last < 300 && !e.target.closest('input,textarea,select')) e.preventDefault(); last = n; }, { passive:false });
})();</script>

<title>K-BEAUTiCS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --o1:#ee9bb4; --o2:#d8668a; --o3:#b9446c; --osoft:#fbe4ec;
  --red:#c8385e; --redsoft:#fde8ee; --green:#3d9a6b; --blue:#7a5bd1;
  --bg:#faf6f4; --card:#fff; --text:#1d1d1f; --muted:#8c8c92; --line:#efedea;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Kantumruy Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--o2)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
s{color:var(--muted);font-size:12px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--red)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
#view{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{padding:0 12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.pri{background:linear-gradient(90deg,var(--o1),var(--o2));border:0;color:#fff}
.btn.out{border:1.5px solid var(--o2);color:var(--o3);background:#fff}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}

/* ---------- header ---------- */
.hdr{background:linear-gradient(180deg,#fff,#fdf1f4);padding:10px 12px 0;position:relative;z-index:15;border-bottom:1px solid #f6e3e9}
.brand{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.brand img{width:40px;height:auto}
.brand .wm img.wmi{width:auto;height:19px;display:block;margin:2px 0 3px}
.brand .wm{font-size:20px;letter-spacing:2px;font-weight:500;color:#3a3a44}
.brand .wm b{color:var(--o2);font-weight:600}
.brand .tl{font-size:11px;color:var(--muted);letter-spacing:.3px;margin-top:-2px}
.hrow{display:flex;gap:10px;align-items:center;padding-bottom:10px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #f3cfdb;border-radius:99px;padding:9px 14px;color:var(--muted);cursor:pointer;font-size:15px}
.hbtn{width:42px;height:42px;border-radius:50%;background:var(--osoft);display:flex;align-items:center;justify-content:center;color:var(--o3);border:0;position:relative}
.hbtn .dot{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;border:2px solid var(--o2)}
.ctabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 0}
.ctabs::-webkit-scrollbar{display:none}
.ctabs a{color:#8c7f86;font-size:11px;font-weight:600;line-height:1.25;white-space:nowrap;padding:6px 0 8px;border-bottom:3px solid transparent;cursor:pointer}
.ctabs a.on{color:var(--o3);border-bottom-color:var(--o2)}

/* ---------- top bar for inner pages ---------- */
.tbar{position:sticky;top:0;z-index:15;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbar h2{margin:0;font-size:17px;flex:1;text-align:center;padding-right:38px}
.tbar .bk{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center}

/* ---------- banners ---------- */
.banners{position:relative;margin:12px 0}
.btrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);scrollbar-width:none}
.btrack::-webkit-scrollbar{display:none}
.btrack img{flex:0 0 100%;width:100%;aspect-ratio:2/1;object-fit:cover;scroll-snap-align:center;display:block;cursor:pointer;background:#fff}
.bslide{flex:0 0 100%;width:100%;aspect-ratio:2/1;scroll-snap-align:center;position:relative;overflow:hidden;cursor:pointer;color:#fff}
.bslide img{width:100%;height:100%;object-fit:cover;display:block}
.bslide .bw{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;display:flex;flex-direction:column;gap:3px}
.bslide.pic .bw{background:linear-gradient(transparent,rgba(0,0,0,.55))}
.bslide.txt .bw{top:0;justify-content:center;padding:18px 22px}
.bslide b{font-size:21px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.15)}.bslide span{font-size:14px;opacity:.95}
.bslide em{font-style:normal;align-self:flex-start;margin-top:8px;background:#fff;color:var(--o3);font-weight:700;font-size:13px;border-radius:99px;padding:6px 14px}
.bslide .bb{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.bdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.bdots i{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.55);transition:all .25s}
.bdots i.on{width:18px;background:#fff}

/* ---------- sections ---------- */
.sec{margin:14px 0;border-radius:var(--r);padding:14px 0 12px}
.sec.flash{background:linear-gradient(180deg,#fde4ea,#fff5f7)}
.sec.best{background:linear-gradient(180deg,#fbeee9,#fffaf8)}
.sec.new{background:linear-gradient(180deg,#eaf5ee,#f7fbf8)}
.shead{display:flex;align-items:center;gap:8px;padding:0 12px 10px}
.shead h3{margin:0;font-size:18px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sec.flash .shead{gap:6px;flex-wrap:wrap;row-gap:4px}
.sec.flash .shead h3{font-size:17px}
.sec.flash .shead .va{padding:4px 2px}
.shead .va{margin-left:auto;font-size:14px;font-weight:600;color:var(--o3);border:1.5px solid var(--o1);border-radius:99px;padding:4px 12px;background:#fff5f8;cursor:pointer;white-space:nowrap}
.sec.flash h3{color:var(--red)}
.sec.new .va{color:var(--green);border-color:#a7dcc0;background:#f0fbf5}
.cd{display:flex;align-items:flex-start;gap:3px}
.cd b{background:var(--red);color:#fff;border-radius:6px;padding:2px 4px;font-size:13px;min-width:25px;text-align:center;display:block}
.cd i{font-style:normal;color:var(--red);font-weight:700;padding-top:2px}
.cd small{display:block;text-align:center;font-size:10px;color:var(--red);margin-top:1px}
.ends{padding:0 12px 10px;font-size:13px;color:var(--muted);margin-top:-4px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}

/* ---------- product cards ---------- */
.hc{flex:0 0 148px;background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column}
.hc .im,.pc .im{aspect-ratio:1;background:#f1efec center/cover no-repeat;position:relative}
.disc{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:7px;padding:2px 7px}
.hc.fl .disc{left:8px;right:auto}
.rank{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--o2);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.newb{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px}
.ptag{position:absolute;bottom:8px;left:8px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;color:#fff}
.ptag.pre{background:var(--blue)}
.ptag.out{background:rgba(0,0,0,.6)}
.bd{padding:8px 10px 10px;display:flex;flex-direction:column;flex:1}
.nm{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.hbtn.lbtn{width:auto;padding:0 10px;font-size:13px;font-weight:600;border-radius:99px}
.khqr{margin:10px auto;max-width:280px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.1);text-align:center;padding-bottom:12px}
.khh{background:#E1232E;color:#fff;font-weight:800;letter-spacing:2px;padding:10px;font-size:18px;border-bottom-right-radius:30px}
.khn{text-align:left;padding:10px 18px 0;font-size:14px;color:#333}.kha{text-align:left;padding:0 18px 6px;font-size:24px;font-weight:800;border-bottom:1px dashed #ddd;margin-bottom:8px}
.khc{width:220px;height:220px;margin:0 auto}.khc svg{width:100%;height:100%}
.khrl{font-size:12px;color:var(--muted);font-weight:500}
.curseg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin:6px 0}.curseg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font:inherit;font-size:14px;color:#555}
.curseg button.on{background:#fff;color:var(--o3);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pred{color:var(--red);font-weight:600}
.hbtn.tgb{background:#e3f2fb;color:#229ED9}.hbtn.tgb .ic{stroke:#229ED9}
.pnote{font-size:10.5px;line-height:1.25;color:var(--muted);margin-bottom:2px;margin-top:auto;padding-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pnote.big{font-size:13px;margin-bottom:2px;max-width:none;white-space:normal}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.price{color:var(--red);font-weight:700;font-size:17px;line-height:1.1}
.cbtn{width:40px;height:30px;border-radius:99px;border:1.5px solid var(--text);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn .ic{width:18px;height:18px}
.sold{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px}
.bar{height:6px;background:#f8d3dd;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:flex;align-items:center;justify-content:center;color:#555}
.heart .ic{width:19px;height:19px}
.heart.on{color:var(--red)}
.heart.on .ic{fill:var(--red)}
.pc .disc{top:auto;bottom:8px;right:auto;left:8px}
.pc .ptag{bottom:8px;left:auto;right:8px}
.titleline{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-weight:700;font-size:17px}
.titleline:before{content:"";width:4px;height:18px;border-radius:9px;background:var(--o2)}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

/* ---------- category shortcuts ---------- */
.shortcuts{display:flex;gap:6px;justify-content:space-between;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.shortcuts::-webkit-scrollbar{display:none}
.shortcuts .circ{flex:1 0 56px;min-width:56px;max-width:76px}
.shortcuts .cim{width:42px;height:42px}
.shortcuts b{font-size:11px;font-weight:600;color:#4a4a52;line-height:1.25;word-break:normal;overflow-wrap:normal;hyphens:auto}
/* ---------- request type choice ---------- */
.rtype{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.rtype a{border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
.rtype a.on{border-color:var(--o2);background:#fff5f8}
.rtype .ic{color:var(--o2);margin-bottom:6px}
.rtype b{display:block;font-size:14px}
.rtype span{font-size:12px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
/* ---------- request photos ---------- */
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pics .p{position:relative;width:72px;height:72px;border-radius:12px;background:#f1efec center/cover;flex-shrink:0;cursor:pointer}
.pics .p button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--red);color:#fff;font-size:13px;line-height:1;padding:0}
.pics .add{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--o1);background:#fff5f8;color:var(--o3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;cursor:pointer}
.pics .add .ic{width:22px;height:22px}
.pics.sm .p{width:56px;height:56px;border-radius:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:12px 0 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
/* ---------- request promo ---------- */
.promo{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fdeef2,#f9dbe4);border-radius:var(--r);padding:14px;margin:14px 0;cursor:pointer}
.promo .pi{width:46px;height:46px;border-radius:12px;background:var(--o2);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.promo b{display:block;font-size:16px}
.promo .ar{margin-left:auto;color:var(--o3)}

/* ---------- categories page ---------- */
.cwrap{display:flex;align-items:flex-start}
.side{width:104px;flex-shrink:0;background:#fbeff2;position:sticky;top:0;max-height:calc(100vh - 80px);overflow-y:auto;align-self:flex-start;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side a{display:block;padding:18px 6px;text-align:center;font-size:13.5px;word-break:break-word;color:#555;cursor:pointer;line-height:1.3;border-left:3px solid transparent}
.side a.on{background:#fff;color:var(--o3);font-weight:700;border-left-color:var(--o2)}
.cmain{flex:1;min-width:0;padding:12px 10px;background:#fff;min-height:calc(100vh - 190px)}
.circles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px;margin-bottom:12px}
.circ{text-align:center;cursor:pointer}
.circ .cim{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;background:linear-gradient(160deg,#f3a9bf,#e07a9b) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.circ b{font-size:11.5px;font-weight:600;display:block;line-height:1.2}
.circ span{font-size:11px;color:var(--muted)}
.sortrow{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.sortrow h4{margin:0;font-size:16px}
.sortrow select{border:0;background:#fbe9ef;border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px;max-width:150px}
.cmain .grid{gap:8px}

/* ---------- cart ---------- */
.flashstrip{background:#d8668a;color:#fff;display:flex;align-items:center;gap:7px;padding:9px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.flashstrip .cd b{background:#fff;color:var(--red);font-size:13px}
.flashstrip .cd i{color:#fff}
.flashstrip u{margin-left:auto;cursor:pointer;white-space:nowrap}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .th{width:86px;height:86px;border-radius:12px;background:#f1efec center/cover;flex-shrink:0;cursor:pointer}
.ci .inf{flex:1;min-width:0;display:flex;flex-direction:column}
.ci .nm{min-height:0;-webkit-line-clamp:2}
.st{font-size:13px;font-weight:600;margin:3px 0}
.st.in{color:var(--green)} .st.pre{color:var(--blue)}
.ci .row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto}
.stp{display:inline-flex;align-items:center;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}
.stp button{border:0;background:#fff;width:36px;height:34px;display:flex;align-items:center;justify-content:center}
.stp button .ic{width:18px;height:18px}
.stp span{min-width:30px;text-align:center;font-weight:700}
.stp .del{color:var(--red)}
.checkbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 14px;z-index:18}
.checkbar .tot{font-size:22px;font-weight:700;color:var(--red)}
.checkbar .tot small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.checkbar .btn{flex:1;border-radius:14px;font-size:16px;padding:13px}
.has-checkbar{padding-bottom:calc(150px + env(safe-area-inset-bottom))!important}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .t{font-weight:700;font-size:17px}
.note{background:#fff5f8;border:1px solid #f6d6e0;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}

/* ---------- me ---------- */
.mehead{background:linear-gradient(180deg,#fde9ef,var(--bg));padding:20px 14px 10px;display:flex;gap:14px;align-items:center}
.ava{width:74px;height:74px;border-radius:50%;background:#d8668a center/cover;color:#fff;font-size:32px;font-weight:600;display:flex;align-items:center;justify-content:center;border:3px solid var(--o1);flex-shrink:0}
.mehead h2{margin:0 0 6px;font-size:21px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #f1bccc;background:#fff5f8;color:var(--o3);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.stats{display:flex;background:#fff;border-radius:var(--r);padding:14px 4px;margin:0 0 12px}
.stats a{flex:1;text-align:center;cursor:pointer;border-right:1px solid var(--line)}
.stats a:last-child{border-right:0}
.stats .ic{margin:0 auto 4px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--muted)}
.ohead{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ohead b{font-size:17px}
.ohead a{color:var(--o3);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center}
.oicons{display:flex}
.oicons a{flex:1;text-align:center;cursor:pointer;font-size:12px;font-weight:600}
.oicons .oi{width:48px;height:48px;border-radius:14px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;position:relative}
.oicons .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:1px 6px;border:2px solid #fff}
.menu a{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.menu a:last-child{border-bottom:0}
.menu .ar{margin-left:auto;color:var(--muted)}

/* ---------- product page ---------- */
.pgal{position:relative;background:#fff}
.pgal .trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pgal .trk::-webkit-scrollbar{display:none}
.pgal img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center;background:#f1efec}
.pgal .cnt{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;border-radius:99px;padding:3px 10px}
.fbk{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;z-index:2}

.pinfo{background:#fff;padding:14px;margin-bottom:10px}

.pinfo .askp{font-size:22px}

.pinfo h1{font-size:18px;margin:10px 0 6px;line-height:1.4;font-weight:600}
.botbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20}
.botbar .ib{width:46px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#555;border:0;background:none;position:relative}
.botbar .ib .n{position:absolute;top:-4px;right:2px;background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px}
.botbar .ib.on{color:var(--red)} .botbar .ib.on .ic{fill:var(--red)}
.botbar .btn{flex:1;border-radius:99px;padding:12px 8px}

/* ---------- orders ---------- */
.otabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;scrollbar-width:none;position:sticky;top:59px;z-index:14;border-bottom:1px solid var(--line)}
.otabs::-webkit-scrollbar{display:none}
.otabs a{padding:7px 14px;border-radius:99px;background:var(--bg);white-space:nowrap;font-size:14px;cursor:pointer}

.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}

function catIcon(name){ const n=(name||'').toLowerCase();
  if (/baby|kid|child|ក្មេង/.test(n)) return 'baby';
  if (/hair|សក់/.test(n)) return 'hair';
  if (/fragr|perfum|gift|ទឹកអប់/.test(n)) return 'perfume';
  if (/lash|brow|eye|រោម/.test(n)) return 'eye';
  if (/tool|brush|puff|sponge/.test(n)) return 'brush';
  if (/skin|face|ស្បែក/.test(n)) return 'face';
  if (/cosmet|make|lip|គ្រឿងសំអាង/.test(n)) return 'lipstick';
  if (/personal|body|hair|bath|care/.test(n)) return 'bottle';
  if (/health|well|vitamin|supplement/.test(n)) return 'leaf';
  if (/daily|home|use/.test(n)) return 'bag';
  return 'spark'; }

const REQ = { pending:'Waiting for quote', quoted:'Price ready', accepted:'Ordered', rejected:'Not available', cancelled:'Cancelled' };
const TYPE = { stock:'Order', preorder:'Pre-order', taobao_link:'Special order' };
const RTYPE = { preorder:'Pre-order', custom_brand:'Custom brand' };

// ====== STATE ======
let S = { settings:{}, categories:[], products:[], banners:[], customer:{}, my:null };
let clockOffset = 0;
let TAB = 'home', STACK = [], CATSEL = 'featured', SORT = 'rel';
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(_){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }
};
let cart = store.get('kt_cart', {}) || {};
let wish = new Set(store.get('kt_wish', []) || []);

function toast(m, ms=2400){ const t=$('#toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'), ms); }
function sheet(html){ $('#sbox').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.remove('hidden'); $('#sbox').scrollTop = 0; }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#sbox').innerHTML=''; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

async function api(action, data = {}){
  const res = await fetch(API, {
    method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY },
    body: JSON.stringify({ action, initData: tg?.initData || '', ...data })
  });
  let j = {}; try { j = await res.json(); } catch(_){}
  if (!res.ok || j.error) throw new Error(j.error || 'Connection problem, please try again');
  return j;
}

// ====== PRICES & FLASH SALE ======
const now = () => Date.now() + clockOffset;
const flashEnd = () => S.settings.flash_sale_ends_at ? new Date(S.settings.flash_sale_ends_at).getTime() : 0;
const flashOn = () => flashEnd() > now();
const isFlash = p => flashOn() && p.flash_price_usd != null;
const price = p => Number(isFlash(p) ? p.flash_price_usd : p.price_usd);
function was(p){
  if (isFlash(p) && Number(p.price_usd) > price(p)) return Number(p.price_usd);
  const c = Number(p.compare_at_price_usd || 0);
  return c > price(p) ? c : 0;
}
const off = p => { const w = was(p); return w ? Math.round((1 - price(p) / w) * 100) : 0; };
const soldTxt = n => n < 10 ? `${n}` : `${Math.floor(n/10)*10}+`;
const isOut = p => false;   // no stock control — customers can always order
const noPrice = p => !(price(p) > 0);   // price not set yet (0) → customer taps "Ask price" instead of buying
const priceHtml = p => noPrice(p) ? '<span class="askp">Ask price</span>' : money(price(p));
const TGU = () => String(S.settings?.contact_telegram || '').trim().replace(/^@/, '');
function chatUs(text){ CHATDRAFT = text || ''; setTab('chat'); }
function tgChat(text){
  const u = TGU(); if (!u) return toast('Chat is not set up yet');
  const link = 'https://t.me/' + encodeURIComponent(u) + (text ? '?text=' + encodeURIComponent(text) : '');
  try { tg.openTelegramLink(link); } catch(_){ window.open(link, '_blank'); }
}
const chatBtn = (label, text) => `<button class="btn out block" style="margin-top:10px" onclick='chatUs(${JSON.stringify(text||"").replace(/'/g,"&#39;")})'>💬 ${label}</button>`;
const pnote = big => { const t = String(S.settings?.price_note || '').trim(); if (!t) return '';
  const html = t.split(/(\([^)]*\))/).map(x => /^\(.*\)$/.test(x) ? `<span class="pred">${esc(x)}</span>` : esc(x)).join(''); // (…) part in red
  return `<div class="pnote${big?' big':''}">${html}</div>`; };
const NP_TXT = '<span class="askp">Price on Telegram</span>';
const lineMoney = (unit, qty) => Number(unit) > 0 ? money(unit*qty) : NP_TXT;
const prod = id => S.products.find(p => p.id === +id);
const img0 = p => p?.images?.[0] || '';
function parts(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000); return [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60].map(x => String(x).padStart(2,'0')); }
function cdBoxes(labels=true){
  const [d,h,m,s] = parts(flashEnd() - now());
  const box = (v,l) => `<span><b data-u="${l}">${v}</b>${labels?`<small>${l}</small>`:''}</span>`;
  return `<span class="cd" data-cd>${box(d,'d')}<i>:</i>${box(h,'h')}<i>:</i>${box(m,'m')}<i>:</i>${box(s,'s')}</span>`;
}
setInterval(() => {
  const els = document.querySelectorAll('[data-cd]'); if (!els.length) return;
  if (!flashOn()){ refreshProducts().then(render); return; }
  const v = parts(flashEnd() - now());
  els.forEach(el => el.querySelectorAll('b').forEach((b,i) => b.textContent = v[i]));
}, 1000);

// ====== CART & WISHLIST ======
function saveCart(){ store.set('kt_cart', cart); drawBadges(); }
function cartLines(){ return Object.entries(cart).map(([id,qty]) => ({ p: prod(id), qty })).filter(l => l.p && l.qty > 0); }
function drawBadges(){ const n = cartLines().reduce((s,l)=>s+l.qty,0); const el=$('#cartN'); el.textContent=n; el.classList.toggle('hidden', !n); }
function addToCart(id, qty=1, silent){
  const p = prod(id); if (!p) return false;
  const n = (cart[id]||0) + qty;
  cart[id] = Math.min(n, 999); saveCart(); haptic('success');
  if (!silent) toast('Added to cart');
  return true;
}
function toggleWish(id, el){
  id = +id;
  if (wish.has(id)) wish.delete(id); else { wish.add(id); haptic('success'); }
  store.set('kt_wish', [...wish]);
  if (el){ el.classList.toggle('on', wish.has(id)); }
}

// ====== ROUTER ======
const TABS = { home, cats, chat: chatTab, me, cart: cartTab };
const VIEWS = { product: productView, checkout: checkoutView, orders: ordersView, taobao: taobaoView, search: searchView, wishlist: wishView, list: listView };
function render(){
  const top = STACK[STACK.length-1];
  const inner = !!top;
  document.querySelectorAll('nav.bn a').forEach(a => a.classList.toggle('on', a.dataset.t === TAB)); drawChatBadge();
  const hideNav = inner && ['product','checkout'].includes(top.name);
  $('#bn').classList.toggle('hidden', hideNav);
  $('#view').classList.remove('has-checkbar'); $('#view').classList.remove('chatview');
  if (inner) VIEWS[top.name](top.args || {}); else TABS[TAB]();
  try { inner ? tg.BackButton.show() : tg.BackButton.hide(); } catch(_){}
  startBanners();
}
function go(name, args){ STACK.push({ name, args, y: window.scrollY }); render(); window.scrollTo(0,0); }
function back(){ const v = STACK.pop(); render(); if (v) window.scrollTo(0, v.y || 0); }
function setTab(t){ TAB = t; STACK = []; closeSheet(); render(); window.scrollTo(0,0); }
document.querySelectorAll('nav.bn a').forEach(a => a.onclick = () => setTab(a.dataset.t));
const topbar = title => `<div class="tbar"><button class="bk" onclick="back()">${ic('back')}</button><h2>${esc(title)}</h2></div>`;

// ====== CARDS ======
function heartBtn(p){ return `<button class="heart ${wish.has(p.id)?'on':''}" onclick="event.stopPropagation();toggleWish(${p.id},this)">${ic('heart')}</button>`; }
function cartBtn(p){ return `<button class="cbtn" onclick="event.stopPropagation();addToCart(${p.id})" ${isOut(p)?'disabled style="opacity:.35"':''}>${ic('cart')}</button>`; }
function tagFor(p){ return p.is_preorder ? '<span class="ptag pre">Pre-order</span>' : isOut(p) ? '<span class="ptag out">Sold out</span>' : ''; }
function pcard(p){
  const w = was(p), o = off(p);
  return `<div class="pc" onclick="go('product',{id:${p.id}})">
    <div class="im" style="background-image:url('${esc(img0(p))}')">${heartBtn(p)}${o?`<span class="disc">-${o}%</span>`:''}${tagFor(p)}</div>
    <div class="bd"><div class="nm">${esc(p.name)}</div>
      ${p.sold?`<div class="sold">${ic('bag','width:13px;height:13px')} ${soldTxt(p.sold)} sold</div>`:''}
      ${pnote()}<div class="prow" style="padding-top:2px"><div><div class="price">${priceHtml(p)}</div>${w?`<s>${money(w)}</s>`:''}</div>${cartBtn(p)}</div></div></div>`;
}
function hcard(p, kind, i){
  const w = was(p), o = off(p);
  let badge = '', foot = '';
  if (kind === 'flash'){
    foot = p.is_preorder ? `<div class="sold">Pre-order</div>` : p.sold ? `<div class="sold">${ic('bag','width:13px;height:13px')} ${soldTxt(p.sold)} sold</div>` : '';
  }
  if (kind === 'best'){ badge = `<span class="rank">${i+1}</span>`; foot = `<div class="sold">${ic('bag','width:13px;height:13px')} ${soldTxt(p.sold)} sold</div>`; }
  if (kind === 'new'){ badge = '<span class="newb">New</span>'; }
  return `<div class="hc ${kind==='flash'?'fl':''}" onclick="go('product',{id:${p.id}})">
    <div class="im" style="background-image:url('${esc(img0(p))}')">${badge}${o?`<span class="disc">-${o}%</span>`:''}${kind!=='flash'?tagFor(p):''}</div>
    <div class="bd">${kind!=='flash'?`<div class="nm">${esc(p.name)}</div>`:''}
      ${pnote()}<div class="prow" style="padding-top:2px"><div><div class="price">${priceHtml(p)}</div>${w?`<s>${money(w)}</s>`:''}</div>${cartBtn(p)}</div>${foot}</div></div>`;
}
const flashItems = () => flashOn() ? S.products.filter(p => p.flash_price_usd != null) : [];
const bestItems = () => S.products.filter(p => p.sold > 0).sort((a,b) => b.sold - a.sold);
const newItems = () => [...S.products].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).filter(p => Date.now() - new Date(p.created_at) < 30*864e5);
function sorted(list){
  const l = [...list];
  if (SORT === 'best') l.sort((a,b) => b.sold - a.sold);
  if (SORT === 'low') l.sort((a,b) => price(a) - price(b));
  if (SORT === 'high') l.sort((a,b) => price(b) - price(a));
  if (SORT === 'new') l.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if (SORT === 'rel') l.sort((a,b) => (isOut(a) - isOut(b)) || (b.sold - a.sold));
  return l;
}
const sortSelect = () => `<select onchange="SORT=this.value;render()">${[['rel','Relevance'],['best','Best selling'],['low','Price: low to high'],['high','Price: high to low'],['new','Newest']].map(([k,v])=>`<option value="${k}" ${SORT===k?'selected':''}>${v}</option>`).join('')}</select>`;

// ====== HEADER ======
function header(ph, tabs){
  return `<div class="hdr">
      <div class="brand"><img src="${LOGO}" alt=""><div><div class="wm"><img class="wmi notr" src="${LOGO_NAME}" alt="K-BEAUTiCS"></div><div class="tl">Your Beauty, Your Confidence</div></div>
        <button class="hbtn lbtn" style="margin-left:auto" onclick="langSheet()" title="Language">${(LANGS.find(x=>x[0]===LANG)||LANGS[1])[1]}</button>
        <button class="hbtn tgb" onclick="TGU() ? tgChat('') : setTab('chat')" title="Telegram">${ic('tgram')}</button></div>
      <div class="hrow"><div class="sbox" onclick="go('search')">${ic('search')}<span>${ph}</span></div></div>
      ${tabs||''}</div>`;
}

/* KHQR (Bakong) with the amount filled in — standard EMVCo format, checked with CRC16 */
function khqrString({ account, name, city, amount, bill, currency = 'USD' }){
  const f = (id, v) => { v = String(v); return id + String(v.length).padStart(2, '0') + v; };
  const clean = (s, n) => String(s || '').normalize('NFKD').replace(/[^\x20-\x7E]/g, '').trim().slice(0, n);
  const now = Date.now();
  let s = f('00', '01') + f('01', amount ? '12' : '11')
    + f('29', f('00', clean(account, 32)))
    + f('52', '5999') + f('53', currency === 'KHR' ? '116' : '840')
    + (amount ? f('54', currency === 'KHR' ? String(Math.round(amount)) : Number(amount).toFixed(2)) : '')
    + f('58', 'KH') + f('59', clean(name, 25) || 'K-BEAUTICS') + f('60', clean(city, 15) || 'Phnom Penh')
    + (bill ? f('62', f('01', clean(bill, 25))) : '')
    + f('99', f('00', String(now)) + f('01', String(now + 24 * 3600e3)))
    + '6304';
  let crc = 0xFFFF;
  for (let i = 0; i < s.length; i++){ crc ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return s + crc.toString(16).toUpperCase().padStart(4, '0');
}

let CHAT = null, CHATDRAFT = '', CHATPIC = null, CHATBUSY = false, CHATUNREAD = 0;
const hm = d => { const x = new Date(d); return String(x.getHours()).padStart(2,'0') + ':' + String(x.getMinutes()).padStart(2,'0'); };
function chatBubbles(){
  const ms = CHAT || [];
  let last = '';
  const out = [`<div class="cm admin"><div class="cb">Hi! 👋 Ask us anything — prices, products, delivery. We usually reply quickly.</div></div>`];
  for (const m of ms){
    const day = fmtD(m.created_at, { y:1 });
    if (day !== last){ out.push(`<div class="cday">${day}</div>`); last = day; }
    out.push(`<div class="cm ${m.sender}"><div class="cb">${m.image?`<img src="${esc(m.image)}" onclick="viewPhoto('${esc(m.image)}')">`:''}${m.body?`<div class="ct notr">${esc(m.body).replace(/\n/g,'<br>')}</div>`:''}<span class="ctm">${hm(m.created_at)}</span></div></div>`);
  }
  return out.join('');
}
function drawChat(scroll){
  const box = $('#cmsgs'); if (!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = CHAT ? chatBubbles() : '<div class="spin"></div>';
  if (scroll || atBottom) box.scrollTop = box.scrollHeight;
}
async function loadChat(scroll){
  try { const r = await api('chat_list'); const changed = JSON.stringify(r.messages.map(m=>m.id)) !== JSON.stringify((CHAT||[]).map(m=>m.id)) || !CHAT;
    CHAT = r.messages; CHATUNREAD = 0; drawChatBadge(); if (changed) drawChat(scroll); } catch(e){ if (!CHAT){ CHAT = []; drawChat(true); } }
}
function drawChatBadge(){ const el = $('#chatN'); if (!el) return; el.textContent = CHATUNREAD; el.classList.toggle('hidden', !CHATUNREAD || TAB === 'chat'); }
function chatTab(){
  $('#view').classList.add('chatview');
  $('#view').innerHTML = `<div class="chead"><img src="${LOGO}"><div><b>K-BEAUTiCS</b><span>Chat with us</span></div>
      ${TGU()?`<button class="btn out" onclick="tgChat('')">${ic('chat')} Telegram</button>`:''}</div>
    <div class="cmsgs" id="cmsgs"></div>
    <div class="cbar">
      <div id="cpic" class="cpic hidden"></div>
      <label class="cicon" for="cfile">${ic('camera')}</label><input type="file" id="cfile" accept="image/*" class="hidden">
      <textarea id="ctext" rows="1" placeholder="Type a message…">${esc(CHATDRAFT)}</textarea>
      <button class="csend" id="csend">${ic('send')}</button>
    </div>`;
  CHATDRAFT = '';
  drawChat(true); loadChat(true);
  const ta = $('#ctext'); const grow = () => { ta.style.height = '40px'; if (ta.scrollHeight > 42) ta.style.height = Math.min(110, ta.scrollHeight + 2) + 'px'; }; ta.oninput = grow; grow();
  if (ta.value) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  $('#cfile').onchange = async e => { const f = e.target.files[0]; e.target.value=''; if (!f) return;
    try { CHATPIC = await compress(f); $('#cpic').innerHTML = `<img src="${CHATPIC}"><button onclick="CHATPIC=null;this.parentNode.classList.add('hidden')">×</button>`; $('#cpic').classList.remove('hidden'); }
    catch(_){ toast('Could not read this photo, try another'); } };
  $('#csend').onclick = async () => {
    const text = ta.value.trim(); if ((!text && !CHATPIC) || CHATBUSY) return;
    CHATBUSY = true; $('#csend').disabled = true;
    try { const r = await api('chat_send', { body: text, image: CHATPIC }); ta.value = ''; grow(); CHATPIC = null; $('#cpic').classList.add('hidden'); CHAT = r.messages; drawChat(true); haptic('success'); }

    CHATBUSY = false; $('#csend').disabled = false;
  };
}

let bTimer = null;
function startBanners(){
  clearInterval(bTimer);
  const t = $('#btrack'); if (!t) return;
  const n = t.children.length, dots = document.querySelectorAll('.bdots i');
  const idx = () => Math.round(t.scrollLeft / t.clientWidth);
  t.onscroll = () => { const i = idx(); dots.forEach((d,k) => d.classList.toggle('on', k === i)); };
  if (n < 2) return;
  let paused = false;
  t.ontouchstart = () => paused = true;
  t.ontouchend = () => setTimeout(() => paused = false, 4000);
  bTimer = setInterval(() => {
    if (!document.body.contains(t)) return clearInterval(bTimer);
    if (!paused) t.scrollTo({ left: ((idx() + 1) % n) * t.clientWidth, behavior: 'smooth' });
  }, 4000);
}

function bannerSlide(b){
  const go = b.link_kind && b.link_kind !== 'none';
  const words = (b.title || b.body) ? `<div class="bw">${b.title?`<b>${esc(b.title)}</b>`:''}${b.body?`<span>${esc(b.body)}</span>`:''}${go && b.kind==='text'?'<em>Shop now ›</em>':''}</div>` : '';
  if (b.kind === 'text'){ const c = BCOL[b.color] || BCOL.pink;
    return `<div class="bslide txt" onclick="bannerTap(${b.id})" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><i class="bb" style="width:180px;height:180px;right:-40px;top:-60px"></i><i class="bb" style="width:120px;height:120px;right:60px;bottom:-60px"></i>${words}</div>`; }
  return `<div class="bslide pic" onclick="bannerTap(${b.id})"><img src="${esc(b.image_url)}" alt="">${words}</div>`;
}
function bannerTap(id){
  const b = S.banners.find(x => x.id === id); if (!b) return;
  api('banner_tap', { id }).catch(()=>{});
  const v = b.link_value;
  if (b.link_kind === 'product' && prod(v)) return go('product', { id: +v });
  if (b.link_kind === 'category'){ CATSEL = +v; return setTab('cats'); }
  if (b.link_kind === 'url' && v){ try { /^https?:\/\/t\.me\//.test(v) ? tg.openTelegramLink(v) : tg.openLink(v); } catch(_){ window.open(v, '_blank'); } return; }
  if (b.link_kind === 'page'){
    if (v === 'flash' || v === 'best' || v === 'new') return go('list', { kind: v });
    if (v === 'preorder') return go('taobao');
    if (v === 'chat') return setTab('chat');
    if (v === 'cats') return setTab('cats');
  }
}

}

// ====== ORDERS ======
function due(o){
  const left = r2(o.total_usd - o.paid_usd);
  if (o.order_type === 'stock') return { kind:'full', amount:left };
  if (+o.paid_usd === 0 && +o.deposit_usd > 0 && +o.deposit_usd < +o.total_usd) return { kind:'deposit', amount:r2(o.deposit_usd) };
  return { kind: +o.paid_usd === 0 ? 'full' : 'balance', amount:left };
}
async function ordersView({ g='all' }){

function orderCard(o){
  const pays = (o.payments||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const lastRej = pays[0]?.status === 'rejected' ? pays[0] : null;
  const needPrice = (o.order_items||[]).some(i => !(Number(i.unit_price_usd) > 0)) && o.status === 'pending_payment';
  const checking = (o.payments||[]).some(p => p.status === 'pending');
  const canPay = r2(o.total_usd - o.paid_usd) > 0 && !needPrice && !checking && !['cancelled','delivered','payment_review'].includes(o.status);
  const d = due(o);
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(o.order_no)}</b><span class="badge s-${o.status}">${esc(STATUS[o.status]||o.status)}</span></div>
    <div class="small muted" style="margin:2px 0 6px">${TYPE[o.order_type]} · ${dt(o.created_at)}</div>
    ${(o.order_items||[]).map(i=>`<div class="oitem"><div class="th" style="background-image:url('${esc(img0(prod(i.product_id)))}')"></div>
      <div style="flex:1;min-width:0"><div class="nm" style="min-height:0;font-size:14px">${esc(i.product_name)}</div><div class="small muted">${Number(i.unit_price_usd)>0?money(i.unit_price_usd)+' × '+i.qty:'Qty '+i.qty}</div></div><b>${lineMoney(i.unit_price_usd, i.qty)}</b></div>`).join('')}
    <div class="sum small" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px">
      ${+o.delivery_fee_usd?`<div><span>Delivery</span><span>${money(o.delivery_fee_usd)}</span></div>`:''}
      <div><b>Total</b><b style="text-align:right">${needPrice?NP_TXT:money(o.total_usd)+khrLine(o.total_usd,'font-weight:500')}</b></div>
      ${+o.paid_usd?`<div><span>Paid</span><span>${money(o.paid_usd)}</span></div>`:''}
    </div>
    ${needPrice?`<div class="note" style="margin-top:10px">⏳ <b>Waiting for price</b> — we'll message you on Telegram. After you agree, the total shows here and you can pay.${chatBtn('Chat with us', 'Hello! About my order ' + o.order_no)}</div>`:''}
    ${lastRej && canPay?`<div class="note err">Your last payment slip was not accepted${lastRej.reject_reason?': '+esc(lastRej.reject_reason):''}. Please send it again.</div>`:''}
    ${canPay?`<button class="btn pri block" style="margin-top:10px" onclick="paySheet(${o.id})">Pay ${d.kind==='deposit'?'deposit ':d.kind==='balance'?'balance ':''}${money(d.amount)}</button>`:''}
    ${o.status==='pending_payment' && +o.paid_usd===0?`<div style="text-align:center;margin-top:10px"><span class="small muted" style="cursor:pointer;text-decoration:underline" onclick="cancelOrder(${o.id},'${esc(o.order_no)}')">Cancel order</span></div>`:''}
  </div>`;
}
let PAYCUR = 'USD';
function paySheet(id){
  const o = S.my.orders.find(x => x.id === id); if (!o) return;
  const s = S.settings, d = due(o), canKhr = RATE() > 0;
  if (!canKhr) PAYCUR = 'USD';
  const khr = toKhr(d.amount), isKhr = PAYCUR === 'KHR';
  const amtTxt = isKhr ? khr.toLocaleString('en-US') + '៛' : money(d.amount);
  sheet(`
    <h2 style="margin:0 0 4px;font-size:19px">Pay ${esc(o.order_no)}</h2>
    <div class="muted small">${d.kind==='deposit'?'Deposit for your pre-order':d.kind==='balance'?'Remaining balance':'Full payment'}</div>
    <div class="price" style="font-size:26px;margin:6px 0 2px">${money(d.amount)}</div>${khrLine(d.amount,'font-size:15px;font-weight:600;margin-bottom:8px')}
    ${canKhr?`<div class="curseg"><button class="${!isKhr?'on':''}" onclick="PAYCUR='USD';paySheet(${o.id})">Pay in dollars ($)</button><button class="${isKhr?'on':''}" onclick="PAYCUR='KHR';paySheet(${o.id})">Pay in riel (៛)</button></div>
      <div class="small muted" style="text-align:center;margin:-2px 0 8px">Rate: $1 = ${RATE().toLocaleString('en-US')}៛</div>`:''}
    <div class="note">1. Transfer exactly <b class="notr">${amtTxt}</b><br>2. Take a screenshot of the receipt<br>3. Upload it below — we'll confirm soon</div>
    ${s.khqr_account ? `<div class="khqr"><div class="khh">KHQR</div><div class="khn">${esc(s.khqr_name||s.account_name||'K-BEAUTICS')}</div><div class="kha notr">${amtTxt}</div>
        <div class="khc">${(()=>{ try { return khqrSvg(khqrString({ account:s.khqr_account, name:s.khqr_name||s.account_name, city:s.khqr_city, amount: isKhr ? khr : d.amount, currency: PAYCUR, bill:o.order_no })); } catch(_){ return ''; } })()}</div>
        <div class="small muted">Scan with ABA, ACLEDA, Wing or any bank app — the amount is already filled in</div></div>`
      : s.qr_image_url?`<img class="qr" src="${esc(s.qr_image_url)}">`:''}
    ${s.account_number?`<div class="card" style="background:var(--bg)">
      ${s.bank_name?`<div class="small muted">${esc(s.bank_name)}</div>`:''}
      ${s.account_name?`<div><b>${esc(s.account_name)}</b></div>`:''}
      <div style="display:flex;justify-content:space-between"><span style="font-size:17px;letter-spacing:.5px">${esc(s.account_number)}</span><span class="copy small" onclick="copyText('${esc(s.account_number)}')">Copy</span></div></div>`:''}
    <label>Payment slip photo</label><input type="file" id="slip" accept="image/*">
    <img id="prev" class="qr hidden"><p id="pErr" class="err small"></p>
    <button class="btn pri block" id="send" disabled>Send payment slip</button>`);
  let img = null;
  $('#slip').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { img = await compress(f); $('#prev').src = img; $('#prev').classList.remove('hidden'); $('#send').disabled = false; }
    catch(_){ $('#pErr').textContent = 'Could not read this photo, try another'; }
  };
  $('#send').onclick = async () => {
    const b = $('#send'); b.disabled = true; b.textContent = 'Sending…'; $('#pErr').textContent = '';
    try { await api('pay', { order_id: o.id, image: img, currency: PAYCUR }); haptic('success'); closeSheet(); toast('Payment slip sent — we will check it soon'); await loadMy(); render(); }
    catch(e){ $('#pErr').textContent = e.message; b.disabled = false; b.textContent = 'Send payment slip'; }
  };
}
function compress(file){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, 1400 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(im.src); res(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = rej; im.src = URL.createObjectURL(file);
  });
}
function copyText(t){ navigator.clipboard?.writeText(t).then(()=>toast('Copied'), ()=>toast(t)); }
function confirmBox(msg, fn){ if (tg?.showConfirm) tg.showConfirm(T(msg), ok => ok && fn()); else if (confirm(msg)) fn(); }

    + (RPICS.length < 5 ? `<label class="add" for="tFile">${ic('camera')}Add photo</label>` : '');
}

      <p id="tErr" class="err small"></p>

  $('#tFile').onchange = async e => {

  $('#tSend').onclick = async () => {

    try { await api('request', { type: RT, url: $('#tUrl').value, note: $('#tNote').value, qty: parseInt($('#tQty').value)||1, images: RPICS }); RPICS = []; haptic('success'); toast("Sent! We'll reply with a price soon"); await loadMy(); render(); }
    catch(e){ $('#tErr').textContent = e.message; b.disabled = false; b.textContent = 'Request a price'; }
  };
  try { await loadMy(); } catch(e){ $('#rl').innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if (!$('#rl')) return;
  const rs = S.my.requests;
  $('#rl').innerHTML = !rs.length ? '<div class="card empty" style="padding:24px">No requests yet</div>' : rs.map(r => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="small muted"><b style="color:var(--o3)">${RTYPE[r.request_type]||'Pre-order'}</b> · ${dt(r.created_at)} · Qty ${r.qty}</span><span class="badge s-${r.status}">${esc(REQ[r.status]||r.status)}</span></div>
      ${r.item_note?`<div style="margin:6px 0 2px">${esc(r.item_note)}</div>`:''}

      ${r.taobao_url?`<a class="lnk" href="${esc(r.taobao_url)}" target="_blank" rel="noopener">${esc(r.taobao_url.length>60?r.taobao_url.slice(0,60)+'…':r.taobao_url)}</a>`:''}
      ${r.quoted_price_usd!=null && ['quoted','accepted'].includes(r.status)?`<div class="note sum">

function acceptSheet(id){
  const r = S.my.requests.find(x => x.id === id); if (!r) return;
  const s = S.settings, sub = r2(r.quoted_price_usd*r.qty), fee = +s.delivery_fee_usd||0, dep = r2(sub*s.default_deposit_percent/100);
  const c = S.customer;
  sheet(`<h2 style="margin:0 0 8px;font-size:19px">Confirm your order</h2>
    <div class="card sum" style="background:var(--bg)">
      <div><span>Item × ${r.qty}</span><span>${money(sub)}</span></div>
      ${fee?`<div><span>Delivery</span><span>${money(fee)}</span></div>`:''}
      <div class="t"><span>Total</span><span>${money(sub+fee)}</span></div>
      ${dep>0&&dep<sub+fee?`<div class="small"><span>Deposit now (${s.default_deposit_percent}%)</span><b>${money(dep)}</b></div>`:''}

function declineQuote(id){
  confirmBox('Decline this price?', async () => { try { await api('decline_quote', { request_id:id }); await loadMy(); render(); } catch(e){ toast(e.message); } });
}

  Object.assign(S, d);
  S.banners = d.banners || [];
  if (d.server_time) clockOffset = new Date(d.server_time).getTime() - Date.now();
  for (const id of Object.keys(cart)) if (!prod(id)) delete cart[id];
  wish = new Set([...wish].filter(id => prod(id)));
  saveCart();
}

}
